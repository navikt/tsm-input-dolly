apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tsm-input-dolly
  namespace: tsm
  labels:
    team: tsm
spec:
  port: 8080
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 90
  # New nais postgres database:
  uses:
    postgres:
      - name: tsm-input-dolly-postgres
  # Old zalando database:
  postgres:
    clusterName: tsm-input-dolly-postgres-cluster
  filesFrom:
    - emptyDir:
        medium: Memory
      mountPath: /app/docs
  liveness:
    path: /internal/health/alive
  readiness:
    path: /internal/health/ready
  preStopHook:
    http:
      path: /internal/shutdown
  prometheus:
    enabled: true
    path: /internal/metrics
  resources:
    requests:
      cpu: 30m
      memory: 128Mi
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
  kafka:
    pool: nav-dev
  ingresses:
    - "https://tsm-input-dolly.intern.dev.nav.no"
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  accessPolicy:
    outbound:
      rules:
        - application: tsm-pdl-cache
    inbound:
      rules:
        - application: teamsykmelding-mock
          namespace: teamsykmelding
          cluster: dev-gcp
        - application: testnav-sykemelding-proxy-trygdeetaten
          namespace: dolly
          cluster: dev-gcp
        - application: testnav-sykemelding-proxy
          namespace: dolly
          cluster: dev-gcp
        - application: testnav-dolly-proxy-trygdeetaten
          namespace: dolly
          cluster: dev-fss
        - application: testnav-dolly-proxy
          namespace: dolly
          cluster: dev-fss
