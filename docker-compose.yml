services:
  postgres:
    image: postgres:17
    container_name: tsm-input-dolly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pw

  kafka:
    image: confluentinc/confluent-local:8.1.0
    container_name: tsm-input-dolly-kafka
    ports:
      - "9092:9092"
